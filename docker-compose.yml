services:
  db:
    image: postgres:16-alpine
    container_name: auth-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database on first boot, so `npm test` never
      # touches the database you were just clicking around in.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth -d auth_app']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
